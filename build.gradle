plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version='0.1.0'
group='net.barttolo'
base { archivesName='Barttolo-Reliquias-Forge-1.20.1' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft { mappings channel:'official',version:'1.20.1' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.named('jar',Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
minecraft {
 accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
 runs {
  server {
   workingDirectory project.file('run-server')
   args '--nogui'
   mods { barttoloreliquias { source sourceSets.main } }
  }
 }
}
minecraft.runs {
 gameTestServer {
  workingDirectory project.file('run-tests')
  property 'forge.enabledGameTestNamespaces','barttoloreliquias'
  mods { barttoloreliquias { source sourceSets.main } }
 }
}
tasks.named('jar',Jar).configure { exclude 'net/barttolo/reliquias/RelicGameTests*' }
