name: Build and GameTests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle build --no-daemon
      - run: gradle runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Barttolo-Reliquias-build-and-tests
          path: |
            build/libs/*.jar
            run-tests/logs/latest.log
            build/reports/
